<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vantyx AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --orb-color: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            --glass-bg: rgba(15, 23, 42, 0.85);
            --accent-blue: #00d2ff;
        }

        body {
            background-color: #020617;
            background-image: 
                radial-gradient(at 0% 0%, rgba(58, 123, 213, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 210, 255, 0.1) 0px, transparent 50%);
            height: 100vh;
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: white;
            overflow: hidden;
        }

        /* --- ORB STYLES --- */
        .ai-orb {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 65px;
            height: 65px;
            cursor: pointer;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .orb-core {
            width: 100%;
            height: 100%;
            background: var(--orb-color);
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(58, 123, 213, 0.6);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            z-index: 2;
        }

        .orb-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid #3a7bd5;
            border-radius: 50%;
            animation: pulse 2s infinite;
            z-index: 1;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.8); opacity: 0; }
        }

        /* --- CHAT CONTAINER --- */
        .chat-container {
            position: fixed;
            bottom: 110px;
            right: 30px;
            width: 420px;
            height: 600px;
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transform-origin: bottom right;
            z-index: 999;
        }

        .chat-container.hidden {
            opacity: 0;
            transform: scale(0.9) translateY(20px);
            pointer-events: none;
            display: flex !important;
        }

        .chat-header {
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 12px #00ff88;
        }

        .chat-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.1) transparent;
        }

        /* --- MESSAGE BUBBLES --- */
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
            white-space: pre-wrap;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.system, .message.ai {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.08);
            border-bottom-left-radius: 4px;
            color: #e2e8f0;
        }

        .message.user {
            align-self: flex-end;
            background: var(--orb-color);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .chat-input-area {
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }

        .chat-input-area input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px 16px;
            color: white;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input-area input:focus {
            border-color: var(--accent-blue);
        }

        .action-bar {
            display: flex;
            gap: 8px;
        }

        .magic-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .magic-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-blue);
            color: white;
        }

        #send-btn {
            background: var(--orb-color);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
            flex-shrink: 0;
        }

        #send-btn.loading {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #close-chat {
            margin-left: auto;
            color: rgba(255,255,255,0.5);
            font-size: 24px;
            transition: color 0.2s;
        }

        /* --- TYPING INDICATOR --- */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 4px 8px;
        }
        .dot {
            width: 4px;
            height: 4px;
            background: #94a3b8;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }
    </style>
</head>
<body>

<div class="p-10">
    <h1 class="text-4xl font-bold text-slate-200">Vantyx Council Dashboard</h1>
    <p class="text-slate-400 mt-2">Welcome back, Nicholas. Your 2026 project planning is in progress.</p>
    
    <div class="mt-12 grid grid-cols-1 md:grid-cols-3 gap-6 max-w-5xl">
        <div class="p-6 rounded-2xl bg-slate-900/50 border border-white/5 backdrop-blur">
            <h3 class="text-slate-400 text-sm font-medium uppercase tracking-wider">Active Projects</h3>
            <p class="text-2xl font-bold mt-2 text-white">12</p>
        </div>
        <div class="p-6 rounded-2xl bg-slate-900/50 border border-white/5 backdrop-blur">
            <h3 class="text-slate-400 text-sm font-medium uppercase tracking-wider">Pending Approvals</h3>
            <p class="text-2xl font-bold mt-2 text-white">4</p>
        </div>
        <div class="p-6 rounded-2xl bg-slate-900/50 border border-white/5 backdrop-blur">
            <h3 class="text-slate-400 text-sm font-medium uppercase tracking-wider">Budget Utilization</h3>
            <p class="text-2xl font-bold mt-2 text-white">68%</p>
        </div>
    </div>
</div>

<!-- AI Orb Trigger -->
<div id="ai-orb-trigger" class="ai-orb">
    <div class="orb-core"></div>
    <div class="orb-ring"></div>
</div>

<!-- Chat Window -->
<div id="ai-chat-window" class="chat-container hidden">
    <div class="chat-header">
        <div class="status-dot"></div>
        <h4 class="font-semibold text-xs tracking-widest uppercase text-slate-300">Vantyx Core AI</h4>
        <button id="close-chat" title="Close">&times;</button>
    </div>
    
    <div class="chat-body" id="chat-messages">
        <div class="message ai">
            Hello Nicholas. I'm connected to the Vantyx 2026 Strategy Engine. How can I assist with your projects today?
        </div>
    </div>

    <div class="chat-input-area">
        <div class="action-bar mb-3">
            <button id="brainstorm-btn" class="magic-btn">
                <span>✨</span> Brainstorm Project
            </button>
            <button id="summarize-btn" class="magic-btn">
                <span>✨</span> Summarize Strategy
            </button>
        </div>
        <div class="input-wrapper">
            <input type="text" placeholder="Ask Vantyx AI..." id="user-input">
            <button id="send-btn">
                <svg id="send-icon" viewBox="0 0 24 24" width="20" height="20">
                    <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
    </div>
</div>

<script>
    const apiKey = ""; // Provided by environment
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'vantyx-ai-v2';

    const orb = document.getElementById('ai-orb-trigger');
    const chatWindow = document.getElementById('ai-chat-window');
    const closeBtn = document.getElementById('close-chat');
    const input = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const messages = document.getElementById('chat-messages');
    const brainstormBtn = document.getElementById('brainstorm-btn');
    const summarizeBtn = document.getElementById('summarize-btn');

    let isProcessing = false;

    // --- Gemini API Integration ---
    async function callGemini(prompt, systemInstruction = "") {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
        
        const payload = {
            contents: [{ parts: [{ text: prompt }] }],
            systemInstruction: systemInstruction ? { parts: [{ text: systemInstruction }] } : undefined
        };

        let retries = 0;
        const delays = [1000, 2000, 4000, 8000, 16000];

        while (retries < 5) {
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error('API request failed');

                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "I'm sorry, I couldn't process that request.";
            } catch (error) {
                retries++;
                if (retries === 5) throw error;
                await new Promise(res => setTimeout(res, delays[retries - 1]));
            }
        }
    }

    // --- UI Logic ---

    function addMessage(text, role) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}`;
        msgDiv.textContent = text;
        messages.appendChild(msgDiv);
        messages.scrollTop = messages.scrollHeight;
        return msgDiv;
    }

    function showTyping() {
        const typingDiv = document.createElement('div');
        typingDiv.className = 'message ai typing-container';
        typingDiv.innerHTML = `<div class="typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
        messages.appendChild(typingDiv);
        messages.scrollTop = messages.scrollHeight;
        return typingDiv;
    }

    async function handleAction(prompt, systemPrompt) {
        if (isProcessing) return;
        isProcessing = true;
        sendBtn.classList.add('loading');
        
        const typingIndicator = showTyping();

        try {
            const response = await callGemini(prompt, systemPrompt);
            messages.removeChild(typingIndicator);
            addMessage(response, 'ai');
        } catch (error) {
            messages.removeChild(typingIndicator);
            addMessage("Systems are currently experiencing heavy load. Please try again in a moment.", 'ai');
        } finally {
            isProcessing = false;
            sendBtn.classList.remove('loading');
        }
    }

    async function handleUserChat() {
        const text = input.value.trim();
        if (!text || isProcessing) return;

        addMessage(text, 'user');
        input.value = '';
        
        const systemPrompt = "You are Vantyx AI, a high-end council assistant for Nicholas. You are professional, concise, and technical. You help with 2026 council projects, urban planning, and infrastructure strategies.";
        handleAction(text, systemPrompt);
    }

    // --- Event Listeners ---

    orb.onclick = () => {
        chatWindow.classList.toggle('hidden');
        const core = orb.querySelector('.orb-core');
        core.style.transform = 'scale(0.85)';
        setTimeout(() => core.style.transform = 'scale(1)', 150);
    };

    closeBtn.onclick = (e) => {
        e.stopPropagation();
        chatWindow.classList.add('hidden');
    };

    sendBtn.onclick = handleUserChat;
    input.onkeypress = (e) => { if(e.key === 'Enter') handleUserChat(); };

    brainstormBtn.onclick = () => {
        const topic = prompt("What project area should we brainstorm? (e.g. Smart Traffic, Green Parks, 2026 Housing)");
        if (topic) {
            addMessage(`Generate a technical 2026 project outline for: ${topic}`, 'user');
            handleAction(
                `Generate a detailed project outline for "${topic}" including: 1. Objective, 2. Key Milestones for 2026, 3. Potential technical hurdles, and 4. Estimated community impact.`,
                "You are a Senior Project Strategist at Vantyx. Format the response with clear headings."
            );
        }
    };

    summarizeBtn.onclick = () => {
        const chatHistory = Array.from(messages.querySelectorAll('.message'))
            .map(m => `${m.classList.contains('user') ? 'Nicholas' : 'AI'}: ${m.textContent}`)
            .join('\n');
        
        if (messages.children.length < 3) {
            addMessage("There isn't enough conversation history to summarize yet.", 'ai');
            return;
        }

        handleAction(
            `Summarize our key discussion points and any action items from this chat history:\n\n${chatHistory}`,
            "You are a meticulous executive assistant. Provide a bulleted summary of the conversation."
        );
    };

    // Close on escape
    window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') chatWindow.classList.add('hidden');
    });
</script>

</body>
</html>
