<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vantyx SaaS Dashboard</title>

<link rel="stylesheet" href="admin.css">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body>

<!-- ================= MAIN APP ================= -->
<div class="app" id="app" style="display:block;">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <h2>Vantyx Studio</h2>

    <a href="#"><i class="fas fa-chart-line"></i> Dashboard</a>
    <a href="#"><i class="fas fa-folder"></i> Projects</a>
    <a href="#"><i class="fas fa-box"></i> Assets</a>
    <a href="#"><i class="fas fa-users"></i> Clients</a>
    <a href="#"><i class="fas fa-chart-pie"></i> Analytics</a>
    <a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>

  </div>

  <!-- MAIN CONTENT -->


  
  <div class="main">

    <h2>Welcome Back 👋</h2>
    <div class="badge">Admin Panel</div>
<div class="topbar">

  <h2>Dashboard</h2>

  <div class="notif-wrapper" onclick="toggleNotif()">
    <i class="fas fa-bell"></i>
    <span id="notifCount">0</span>

    <div class="notif-dropdown" id="notifDropdown">
      <h4>Notifications</h4>
      <div id="notifList"></div>
      <button onclick="clearNotifications()">Clear All</button>
    </div>
  </div>

</div>
    <!-- STATS CARDS -->
    <div class="grid">

      <div class="card">Income: $4,500</div>
      <div class="card">Projects: 12</div>
      <div class="card">Clients: 34</div>
      <div class="card">Growth: +18%</div>

    </div>



    <!-- CHART -->
    <div class="chart">
      <canvas id="chart"></canvas>
    </div>

    <!-- DRAG & DROP -->
    <div class="dropzone"
         ondragover="allow(event)"
         ondrop="drop(event)">
      Drag & Drop Design Assets Here
    </div>

    <!-- AI PANEL -->
    <div class="ai">
      ⚡ AI Design Assistant (Coming Soon)
    </div>

  </div>

  <!-- CHAT PANEL -->
  <div class="right">

    <h3>Client Chat</h3>

    <div class="chat" id="chat"></div>

    <input type="text" id="msg" placeholder="Type message...">
    <button onclick="send()">Send</button>

  </div>

</div>

<!-- ================= JS ================= -->
<script src="admin.js"></script>

<script>
function logout(){
  localStorage.clear();
  location.reload();
}
</script>

</body>
</html>
